[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goldapple-bot"
version = "0.1.0"
description = "Telegram-бот: отслеживание цен goldapple.kz"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "playwright>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
goldapple-bot = "goldapple_bot.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
